version: "3.8"

services:
  mongo:
    image: mongo:7
    volumes:
      - poly_mongo_data:/data/db
    networks:
      - polynet
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  backend:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-lc", "npm install --omit=dev --no-audit --no-fund && node server.js"]
    environment:
      - MONGO_URL=mongodb://mongo:27017/poly
      - PORT=4000
      - BASE_POINTS=1000000
      - VOTE_COST=1
      - CREATE_COST=20
      - MAX_TITLE_LEN=40
      - SERVER_IP=10.100.102.26
      - ADMIN_TOKEN=keves-admin-2026
    volumes:
      - type: bind
        source: /home/ta9/new_apps/poly/backend
        target: /app
      - poly_backend_node_modules:/app/node_modules
    ports:
      - "4100:4000"
    networks:
      - polynet
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  frontend:
    image: nginx:alpine
    volumes:
      - type: bind
        source: /home/ta9/new_apps/poly/frontend/html
        target: /usr/share/nginx/html
        read_only: true
      - type: bind
        source: /home/ta9/new_apps/poly/frontend/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - "8090:80"
    networks:
      - polynet
    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  polynet:
    driver: overlay
    attachable: true

volumes:
  poly_mongo_data:
  poly_backend_node_modules:
